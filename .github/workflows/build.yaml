name: build

# Builds the app image and publishes it to the Steezr Cloud registry.
# Deployment is not done here: Flux watches the registry and rolls the cluster
# forward, so CI needs no cluster credentials.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.steezr.cloud
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            registry.steezr.cloud/steezr/openrow:main-${{ github.run_number }}-${{ github.sha }}
            registry.steezr.cloud/steezr/openrow:${{ github.sha }}
            registry.steezr.cloud/steezr/openrow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
