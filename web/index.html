<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />

    <title>openrow: Describe your back office. We build it.</title>

      name="description"
      content="openrow turns plain-English descriptions into real Postgres tables, dashboards, and AI-driven automations. Czech bank, accounting and Notion connectors out of the box. Open source, AGPL-3.0."

    <link rel="canonical" href="https://www.openrow.app/" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="openrow" />
    <meta property="og:title" content="openrow: Describe your back office. We build it." />
    <meta
      property="og:description"
      content="Tables, dashboards, automations and connectors in one chat. Czech-flavoured. Self-host or run on openrow.app."

      name="twitter:description"
      content="Tables, dashboards, automations and connectors in one chat. Czech-flavoured. Self-host or run on openrow.app."
    />
    <meta name="twitter:image" content="https://www.openrow.app/og-image.png" />
    <meta name="twitter:image:alt" content="openrow: Describe your back office. We build it." />

    <!-- Structured data: Organization + WebSite + SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.openrow.app/#organization",
            "name": "openrow",
            "url": "https://www.openrow.app/",
            "logo": "https://www.openrow.app/icon-512.png",
            "sameAs": ["https://github.com/steezrcom/openrow"]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.openrow.app/#website",
            "url": "https://www.openrow.app/",
            "name": "openrow",
            "description": "Describe your back office. openrow builds it.",
            "publisher": { "@id": "https://www.openrow.app/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://www.openrow.app/#software",
            "name": "openrow",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web, Linux, macOS, Windows",
            "url": "https://www.openrow.app/",
            "image": "https://www.openrow.app/og-image.png",

            },
            "softwareVersion": "0.1",
            "license": "https://www.gnu.org/licenses/agpl-3.0.html",
            "sameAs": ["https://github.com/steezrcom/openrow"]
          }
        ]
      }
